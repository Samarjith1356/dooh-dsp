services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dooh
      POSTGRES_PASSWORD: dooh
      POSTGRES_DB: dooh_dsp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dooh -d dooh_dsp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/creatives || true;
      mc anonymous set download local/creatives;
      exit 0;
      "

  campaign-api:
    build:
      context: ..
      dockerfile: services/campaign-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dooh:dooh@postgres:5432/dooh_dsp
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio12345
      MINIO_BUCKET: creatives
      MINIO_PUBLIC_URL: http://localhost:9002/creatives
      BRAIN_URL: http://brain:8001
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  brain:
    build:
      context: ..
      dockerfile: services/brain/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dooh:dooh@postgres:5432/dooh_dsp
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bidder:
    build:
      context: ..
      dockerfile: services/bidder/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      SSP_ADAPTER: ${SSP_ADAPTER:-simulator}
      BIDDER_LISTEN: :8081
      INGEST_URL: http://ingest:8090/events
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - redpanda
      - ingest

  ssp-simulator:
    build:
      context: ..
      dockerfile: services/ssp-simulator/Dockerfile
    environment:
      BIDDER_URL: http://bidder:8081/openrtb/v2/bid
      QPS: "50"
    depends_on:
      - bidder

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "8090:8090"
    depends_on:
      - redpanda
      - clickhouse

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - campaign-api

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
