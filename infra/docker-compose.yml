services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dooh
      POSTGRES_PASSWORD: dooh
      POSTGRES_DB: dooh_dsp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dooh -d dooh_dsp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - warn
    ports:
      - "19092:19092"
      - "18082:18082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  campaign-api:
    build:
      context: ..
      dockerfile: services/campaign-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dooh:dooh@postgres:5432/dooh_dsp
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      CREATIVE_DIR: /data/creatives
      CREATIVE_PUBLIC_URL: http://localhost:8000/creatives
      BRAIN_URL: http://brain:8001
      BIDDER_URL: http://bidder:8081
      INGEST_URL: http://ingest:8090
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - creative_data:/data/creatives
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  brain:
    build:
      context: ..
      dockerfile: services/brain/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://dooh:dooh@postgres:5432/dooh_dsp
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      BIDDER_URL: http://bidder:8081
      INGEST_URL: http://ingest:8090
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bidder:
    build:
      context: ..
      dockerfile: services/bidder/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      SSP_ADAPTER: ${SSP_ADAPTER:-simulator}
      BIDDER_LISTEN: :8081
      INGEST_URL: http://ingest:8090/events
    ports:
      - "8081:8081"
    depends_on:
      - redis
      - redpanda
      - ingest

  ssp-simulator:
    build:
      context: ..
      dockerfile: services/ssp-simulator/Dockerfile
    environment:
      BIDDER_URL: http://bidder:8081/openrtb/v2/bid
      QPS: "50"
    depends_on:
      - bidder

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
    ports:
      - "8090:8090"
    depends_on:
      - redpanda
      - clickhouse

  agents:
    build:
      context: ..
      dockerfile: agents/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      AGENT_LISTEN: 0.0.0.0:8091
      BRAIN_URL: http://brain:8001
      BIDDER_URL: http://bidder:8081
      INGEST_URL: http://ingest:8090
      CAMPAIGN_API_URL: http://campaign-api:8000
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      AGENT_HTTP_TIMEOUT_SEC: "3"
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-grok-4.7}
      AGENT_LLM_TIMEOUT_SEC: "90"
    volumes:
      - ./clickhouse/users.d:/app/infra/clickhouse/users.d
    ports:
      - "8091:8091"
    depends_on:
      redis:
        condition: service_healthy
      campaign-api:
        condition: service_started

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BRAIN_URL: http://localhost:8001
      NEXT_PUBLIC_AGENTS_URL: http://localhost:8091
      AGENTS_INTERNAL_URL: http://agents:8091
    ports:
      - "3000:3000"
    depends_on:
      - campaign-api
      - agents

volumes:
  postgres_data:
  clickhouse_data:
  creative_data:
