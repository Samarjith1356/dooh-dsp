name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/campaign-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/campaign-api/requirements.txt
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pytest

  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/brain/requirements.txt
      - name: Install and test
        env:
          PYTHONPATH: ../../packages/ruleset/python
        run: |
          pip install -r requirements.txt
          pytest

  ruleset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruleset/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest and test
        run: |
          pip install pytest
          pytest

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install and test
        run: |
          pip install -r agents/requirements.txt
          python -m pytest agents/tests

  bidder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bidder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/bidder/go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  ssp-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ssp-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/ssp-simulator/go.mod
      - name: Build and test
        run: |
          go build ./...
          go test ./...

  ops-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build

  advertiser-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when apps/advertiser is absent
        id: check
        run: |
          if [ -f apps/advertiser/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/advertiser not present; skipping"
          fi
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/advertiser/package-lock.json
      - if: steps.check.outputs.present == 'true'
        working-directory: apps/advertiser
        run: |
          npm ci
          npm run build
