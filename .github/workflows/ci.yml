name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  campaign-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/campaign-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/campaign-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  brain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/brain/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest
        env:
          PYTHONPATH: ../../packages/ruleset/python

  ruleset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruleset/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest
      - run: pytest

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - run: python -m pytest agents/tests

  bidder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bidder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: services/bidder/go.mod
      - run: go vet ./...
      - run: go test ./...

  ssp-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ssp-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: services/ssp-simulator/go.mod
      - run: go build ./...
      - run: go test ./...

  ops-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  advertiser-app:
    if: hashFiles('apps/advertiser/package.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/advertiser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/advertiser/package-lock.json
      - run: npm ci
      - run: npm run build
